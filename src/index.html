<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#edf2e9">
    <meta name="description" content="Гоблин путешествует по полю 4×4, меняя укрытие каждую секунду.">
    <title>Гоблин на прогулке</title>
  </head>
  <body>
    <main class="game">
      <header class="game__header">
        <p class="game__eyebrow">ДОМАШНЕЕ ЗАДАНИЕ № 2 · DOM</p>
        <h1>Гоблин на прогулке</h1>
        <p class="game__description">Каждую секунду — новое укрытие.<br>Попробуйте уследить за ним!</p>
      </header>
      <div class="board" role="group" aria-label="Игровое поле: 4 строки и 4 столбца"></div>
      <footer class="game__footer">
        <span class="game__status">Гоблин в движении</span>
        <span class="game__interval">Интервал · 1 сек</span>
      </footer>
    </main>
  </body>
</html>
